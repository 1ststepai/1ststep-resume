  - generic [ref=e78]:
    - heading "Frequently asked questions" [level=2] [ref=e79]
    - generic [ref=e80]:
      - heading "Does Job Agent guarantee a number of applications?" [level=3] [ref=e81]
      - paragraph [ref=e82]: No. Application volume depends on suitable openings, your criteria, employer requirements, required approvals, and plan limits. It may be zero. Usage limits are maximum capacity, not guaranteed applications, interviews, or job offers. We do not weaken your criteria or duplicate applications to meet a quota. Prepared drafts are separate from confirmed submissions.
      - paragraph [ref=e83]:
        - link "Read the Job Agent application-volume and usage-limit terms." [ref=e84] [cursor=pointer]:
          - /url: /terms#job-agent-application-limits
    - generic [ref=e85]:
      - heading "How does the free account work?" [level=3] [ref=e86]
      - paragraph [ref=e87]: You get 3 tailored resumes, 1 cover letter, a Career Positioning Brief, Role Match Score, and vault preview every month at no cost. No credit card required.
    - generic [ref=e88]:
      - heading "What is an AI tailor?" [level=3] [ref=e89]
      - paragraph [ref=e90]: Each tailor is one resume rewrite. You paste in your base resume and a job description, and the AI rewrites your resume to match that specific role by closing keyword gaps, reordering priorities, and reframing your experience for the role.
    - generic [ref=e91]:
      - heading "What does Job Agent access include?" [level=3] [ref=e92]
      - paragraph [ref=e93]: Job Agent is free for approved controlled-beta testers. It finds verified openings and prepares application materials. Extension-assisted filling is being enabled and tested first for supported Greenhouse applications; other employer sites and final submission still require you. Paid access is planned at $39/month after the complete workflow is ready, with a separate agreement before any charge.
    - generic [ref=e94]:
      - heading "Can I cancel anytime?" [level=3] [ref=e95]
      - paragraph [ref=e96]: Yes. Cancel from your account settings or contact support at any time. You keep access until the end of your billing period and won't be charged again.
    - generic [ref=e97]:
      - heading "Is my resume data safe?" [level=3] [ref=e98]
      - paragraph [ref=e99]:
        - text: Your resume content is sent to Anthropic's Claude API to generate the tailored output, then returned to your browser. We don't store your resume on our servers and never use it to train AI models. See our
        - link "Privacy Policy" [ref=e100] [cursor=pointer]:
          - /url: /privacy
        - text: for full details.
    - generic [ref=e101]:
      - heading "Do you store my credit card?" [level=3] [ref=e102]
      - paragraph [ref=e103]:
        - text: No. Payment is handled entirely by
        - link "Stripe" [ref=e104] [cursor=pointer]:
          - /url: https://stripe.com
        - text: . We never see or store your card number.
    - generic [ref=e105]:
      - heading "What if I hit my free limit?" [level=3] [ref=e106]
      - paragraph [ref=e107]: You'll see your usage meter in the app. When you reach a free limit, you can wait for the next month's reset or request controlled-beta access. There is no paid Job Agent checkout today.
