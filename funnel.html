<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Opening your 1stStep workspace</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root { color-scheme:light; --ink:#13213c; --muted:#52627a; --brand:#4338ca; --line:#dfe5ee; --bg:#f6f8fc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink); font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(560px,100%); padding:34px; background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:0 18px 50px rgba(19,33,60,.09); }
    .eyebrow { color:var(--brand); font-weight:750; font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:.5rem 0 .65rem; font-size:clamp(1.55rem,5vw,2.15rem); line-height:1.12; }
    p { margin:0; color:var(--muted); }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:24px; }
    a { min-height:44px; display:inline-flex; align-items:center; justify-content:center; border-radius:10px; padding:10px 16px; font:inherit; font-weight:700; text-decoration:none; }
    .primary { color:#fff; background:var(--brand); border:1px solid var(--brand); }
    .secondary { color:var(--ink); background:#fff; border:1px solid var(--line); }
    .spinner { width:22px; height:22px; margin:22px 0 0; border:3px solid #e4e7f8; border-top-color:var(--brand); border-radius:50%; animation:spin .75s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion:reduce) { .spinner { animation:none; border-top-color:#e4e7f8; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">1stStep.ai</div>
    <h1 id="captureTitle">Opening your résumé workspace…</h1>
    <p id="captureMessage" role="status" aria-live="polite">Waiting for the job you captured.</p>
    <div id="captureSpinner" class="spinner" aria-hidden="true"></div>
    <div id="captureActions" class="actions" hidden>
      <a class="primary" href="/app/resume">Open Resume Builder</a>
      <a class="secondary" href="/concierge">Open Job Agent</a>
    </div>
  </main>
  <script>
    const CAPTURE_ID = new URLSearchParams(location.search).get('jobCaptureId') || '';
    const CAPTURE_MODE = new URLSearchParams(location.search).get('mode') || 'tailor';
    const APPLIED_CAPTURE_KEY = '1ststep_capture_applied_id';
    let captureApplied = false;

    function acknowledgeCapture(captureId) {
      window.postMessage({ type: '1STSTEP_JOB_CAPTURE_ACK', version: '1', captureId }, window.location.origin);
    }

    function applyJobCapture(jobData) {
      if (!jobData || typeof jobData !== 'object') return false;
      if (!String(jobData.jobDescription || '').trim()) return false;
      sessionStorage.setItem('1ststep_pending_capture', JSON.stringify({ jobData, ts: Date.now() }));
      sessionStorage.setItem(APPLIED_CAPTURE_KEY, CAPTURE_ID);
      return true;
    }

    window.addEventListener('message', e => {
      if (e.source !== window || e.origin !== window.location.origin) return;
      if (!e.data || e.data.type !== '1STSTEP_JOB_CAPTURE') return;
      const captureId = typeof e.data.captureId === 'string' ? e.data.captureId : '';
      if (!CAPTURE_ID || captureId !== CAPTURE_ID) return;
      if (captureApplied || sessionStorage.getItem(APPLIED_CAPTURE_KEY) === captureId) {
        acknowledgeCapture(captureId);
        return;
      }
      if (!applyJobCapture(e.data.jobData)) return;
      captureApplied = true;
      showJobSaved();
      acknowledgeCapture(captureId);
      const mode = e.data.mode === 'coverLetter' || CAPTURE_MODE === 'coverLetter' ? 'coverLetter' : 'tailor';
      setTimeout(() => location.replace(`/app/resume?jobCaptureId=${encodeURIComponent(captureId)}&mode=${encodeURIComponent(mode)}`), 120);
    });

    function showJobSaved() {
      document.getElementById('captureTitle').textContent = 'Job saved';
      document.getElementById('captureMessage').textContent = 'Opening the Resume Builder so you can review the captured details.';
    }

    function showCaptureUnavailable() {
      document.getElementById('captureTitle').textContent = 'We couldn’t load that job.';
      document.getElementById('captureMessage').textContent = 'Return to the job post and click 1stStep again, or paste the description in the Resume Builder.';
      document.getElementById('captureSpinner').hidden = true;
      document.getElementById('captureActions').hidden = false;
    }

    function requestCapture() {
      if (!CAPTURE_ID) { showCaptureUnavailable(); return; }
      window.postMessage({ type: '1STSTEP_JOB_CAPTURE_REQUEST', version: '1', captureId: CAPTURE_ID }, window.location.origin);
      setTimeout(() => { if (!captureApplied) showCaptureUnavailable(); }, 5000);
    }

    requestCapture();
  </script>
</body>
</html>
