<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>1stStep.ai Job Agent</title>
  <style>
    :root { color-scheme:dark; --bg:#09090b; --card:#141419; --line:#2b2b33; --text:#f7f7f8; --muted:#aaaab5; --violet:#6d5dfc; --green:#42d39b; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:280px; background:var(--bg); color:var(--text); font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { padding:20px; }
    header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding-bottom:16px; }
    .brand { font-size:18px; font-weight:900; letter-spacing:-.04em; }
    .brand span { color:#aaa3ff; }
    #connection { color:var(--muted); font-size:12px; }
    .card { margin-top:18px; padding:18px; border:1px solid var(--line); border-radius:14px; background:var(--card); }
    .eyebrow { color:var(--green); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:8px 0 6px; font-size:22px; line-height:1.15; letter-spacing:-.035em; }
    p { margin:0; color:var(--muted); }
    dl { margin:16px 0 0; }
    dl div { display:grid; grid-template-columns:74px 1fr; gap:10px; padding:9px 0; border-top:1px solid var(--line); }
    dt { color:var(--muted); }
    dd { margin:0; overflow-wrap:anywhere; }
    button { width:100%; min-height:48px; margin-top:12px; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--text); font:inherit; font-weight:800; cursor:pointer; }
    button.primary { border-color:transparent; background:var(--violet); color:#fff; }
    button:disabled { opacity:.55; cursor:wait; }
    button:focus-visible { outline:3px solid #fbbf24; outline-offset:3px; }
    .edit { margin-top:10px; }
    label { display:block; margin-top:10px; color:var(--muted); font-size:12px; }
    input { width:100%; min-height:42px; margin-top:5px; padding:9px 10px; border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--text); font:inherit; }
    input:focus-visible { outline:3px solid #fbbf24; outline-offset:2px; }
    #message { min-height:21px; margin-top:12px; font-size:12px; }
    .privacy { margin-top:16px; font-size:11px; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main>
    <header><div class="brand">1stStep<span>.ai</span></div><span id="connection" role="status">Checking…</span></header>
    <section class="card">
      <div class="eyebrow">Current page</div>
      <h1 id="title">Open a job posting</h1>
      <p id="summary">Capture it in one click. No copying or pasting.</p>
      <dl id="details" hidden>
        <div><dt>Company</dt><dd id="company">—</dd></div>
        <div><dt>Source</dt><dd id="source">—</dd></div>
      </dl>
      <button class="edit" id="edit" hidden>Edit job details</button>
      <div id="editFields" hidden>
        <label for="jobTitle">Job title</label>
        <input id="jobTitle" autocomplete="off" required>
        <label for="companyName">Company name</label>
        <input id="companyName" autocomplete="organization" required>
      </div>
      <button class="primary" id="capture">Capture this job</button>
      <button id="openJobs">Open My Jobs</button>
      <p id="message" role="status" aria-live="polite"></p>
    </section>
    <p class="privacy">The extension reads job-posting content only after you click Capture. It does not read passwords or answers you typed into forms.</p>
  </main>
  <script src="sidepanel.js"></script>
</body>
</html>
